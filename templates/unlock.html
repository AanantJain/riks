<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RIKS — family gate</title>
  <link rel="stylesheet" href="/static/css/app.css?v=rebuild" />
</head>
<body>
  <main id="main" class="narrow">
    <section class="mast">
      <div>
        <p class="eyebrow">Family RIKS</p>
        <h1>Enter the family password</h1>
        <p class="lede">Keeps the two desks and their progress off the public internet.</p>
      </div>
    </section>
    <form class="card form" method="post" action="/unlock">
      {% if wrong %}<p class="flag">That password did not match.</p>{% endif %}
      <input type="hidden" name="next" value="{{ next_path }}" />
      <label>Password
        <input type="password" name="password" autocomplete="current-password" autofocus />
      </label>
      <button class="btn solid" type="submit">Open RIKS</button>
    </form>
  </main>
</body>
</html>
